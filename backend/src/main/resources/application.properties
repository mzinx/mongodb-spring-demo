spring.application.name=mongodb-spring-demo
server.port=8080

# MongoDB connection - change streams require a replica set (or MongoDB Atlas).
# Override with the MONGODB_URI environment variable, e.g.
#   MONGODB_URI="mongodb+srv://user:pass@cluster/mongodb-spring-demo"
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mongodb-spring-demo}

# --- mongodb-spring-change-stream ---
# Reconciliation interval for this app's streams (discovery, messaging, and the
# 'order-summary' materialized-view stream seeded in DemoDataSeeder and executed
# here). The companion mongostream app shares this database and only MANAGES the
# stream/pipeline configs; this app runs them.
change-stream.config-refresh-initial-delay=3000
change-stream.config-refresh-interval=10000

# --- mongodb-spring-message-queuing ---
# Collections watched by the built-in "live-data" change stream; every change to
# one of these pushes the changed document over /sync (full-document live data),
# which the matching frontend view refreshes off.
#   unifiedOrders -> Orders page (the consolidated merge view)
#   ordersByDay / ordersByWeek / ordersByMonth -> Dashboard (period summaries)
# These are the DERIVED collections, kept live via /sync. Writes the user makes
# directly (into the source channel collections) additionally trigger a /cmd
# REFRESH from the write endpoint itself (see ChannelController), so the raw
# source views update immediately too.
messaging.watch-collections=unifiedOrders,ordersByDay,ordersByWeek,ordersByMonth
# STOMP heartbeats (defaults shown) let the server detect dead WebSocket
# connections — including intermittent network drops — so presence drops off
# promptly. A relaxed 25s interval tolerates network/tab-throttling jitter and
# avoids false-positive disconnects (which would drop events broadcast during the
# reconnect gap). Keep these aligned with the client's heartbeat settings in
# frontend/src/stomp.js. Set either to 0 to disable that direction.
#messaging.heartbeat.server-ms=25000
#messaging.heartbeat.client-ms=25000

# --- mongodb-spring-discovery ---
discovery.heartbeat.interval=5000

# --- Spring Session (MongoDB) ---
# HTTP sessions are persisted in the `sessions` collection and expire after 30
# minutes of inactivity; both are configured on @EnableMongoHttpSession in
# SessionConfig. Each browser therefore has a stable, cluster-shared identity
# that drives the messaging presence list.

# --- Actuator health probes ---
# Expose the health endpoint and its Kubernetes-style liveness/readiness probe
# groups at /actuator/health/liveness and /actuator/health/readiness, used by the
# GKE deployment probes (backend/gke/deployment.yaml). Enabled explicitly so the
# probe sub-paths exist even outside a detected Kubernetes environment.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.com.mzinx=INFO
