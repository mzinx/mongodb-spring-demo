spring.application.name=mongodb-spring-demo
server.port=8080

# MongoDB connection - change streams require a replica set (or MongoDB Atlas).
# Override with the MONGODB_URI environment variable, e.g.
#   MONGODB_URI="mongodb+srv://user:pass@cluster/mongodb-spring-demo"
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mongodb-spring-demo}

# --- mongodb-spring-change-stream ---
# Reconciliation interval for this app's streams (discovery, messaging, and the
# 'order-summary' materialized-view stream seeded in DemoDataSeeder and executed
# here). The companion mongostream app shares this database and only MANAGES the
# stream/pipeline configs; this app runs them.
change-stream.config-refresh-initial-delay=3000
change-stream.config-refresh-interval=10000

# --- mongodb-spring-message-queuing ---
# Collections watched by the built-in "live-data" change stream; every change to
# one of these pushes the changed document over /sync (full-document live data),
# which the matching frontend view refreshes off.
#   orders            -> Orders page (the single polymorphic collection) + workflow enrichment
#   paymentLog / shippingAck / fulfillmentLog -> enrichment ledgers; each enrich-* change
#                        stream merges its slice into orders
#   ordersAudit       -> whole-document audit/history mirror (changeMirrorListener)
#   ordersByPeriod    -> Dashboard period summary (day/week/month in one collection)
#   customerSummary / productInventory -> Dashboard rollups (kept live by the rollup-orders stream)
# Order intake writes additionally trigger a /cmd REFRESH from the write endpoint
# itself (see ChannelController / WorkflowService) so views update immediately too.
messaging.watch-collections=orders,paymentLog,shippingAck,fulfillmentLog,ordersAudit,ordersByPeriod,customerSummary,productInventory
# STOMP heartbeats (defaults shown) let the server detect dead WebSocket
# connections — including intermittent network drops — so presence drops off
# promptly. A relaxed 25s interval tolerates network/tab-throttling jitter and
# avoids false-positive disconnects (which would drop events broadcast during the
# reconnect gap). Keep these aligned with the client's heartbeat settings in
# frontend/src/stomp.js. Set either to 0 to disable that direction.
#messaging.heartbeat.server-ms=25000
#messaging.heartbeat.client-ms=25000

# --- mongodb-spring-discovery ---
discovery.heartbeat.interval=5000

# --- Spring Session (MongoDB) ---
# HTTP sessions are persisted in the `sessions` collection and expire after 30
# minutes of inactivity; both are configured on @EnableMongoHttpSession in
# SessionConfig. Each browser therefore has a stable, cluster-shared identity
# that drives the messaging presence list.

# --- Actuator health probes ---
# Expose the health endpoint and its Kubernetes-style liveness/readiness probe
# groups at /actuator/health/liveness and /actuator/health/readiness, used by the
# GKE deployment probes (backend/gke/deployment.yaml). Enabled explicitly so the
# probe sub-paths exist even outside a detected Kubernetes environment.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.com.mzinx=INFO

# --- RAG chatbot ------------------------------------------------------------
# A retrieval-augmented chatbot backed by MongoDB Atlas.
#
#  * Documents (PDF / Word) are uploaded through the Knowledge Base GUI, their
#    text is extracted (Apache Tika), chunked, and stored in the `knowledgeBase`
#    collection. Each chunk keeps only its raw text — Atlas Vector Search
#    "automatic embedding" (Voyage AI, configured on the vector index) generates
#    and stores the embedding server-side, so the app never calls an embedding
#    API directly.
#  * At query time the user's question is passed straight to $vectorSearch with
#    `query` text; Atlas embeds it on the fly and returns the most relevant
#    chunks, which are injected as context into an Anthropic chat completion.
#  * Every turn (question + answer + the chunks used) is appended to the
#    `chatMemory` collection, keyed by the browser's Spring Session id, giving
#    each conversation a durable memory.
#
# Requires an Atlas cluster with Vector Search automatic embedding enabled and
# the Voyage AI model available to the project. Vector Search is unavailable on
# a plain local mongod, so retrieval is skipped gracefully when the index is
# absent.

# Uploaded-file size limits (Word/PDF corpora can be large).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Collections.
rag.knowledge-collection=knowledgeBase
rag.memory-collection=chatMemory

# Atlas Vector Search automatic-embedding index. `rag.embedding-model` is the
# Voyage AI model Atlas uses to embed both stored chunks and incoming queries.
rag.vector-index=knowledge_vector_index
rag.embedding-model=voyage-4
# Create the vector index automatically on startup when it is missing (Atlas
# only). Set false if you provision the index out of band.
rag.auto-create-index=true

# Retrieval / generation tuning.
rag.top-k=5
rag.num-candidates=100
rag.chunk-size=1200
rag.chunk-overlap=150

rag.max-tokens=1024
# How many prior turns of the conversation to replay to the model as memory.
rag.memory-window=10

# --- Chat providers ---------------------------------------------------------
# Chat backends are a LIST. Add/remove providers here without any code change.
# Each provider has:
#   id            stable id used in requests + memory (e.g. ollama, litellm)
#   label         friendly name shown in the UI
#   type          ANTHROPIC (native SDK) | OPENAI (OpenAI-compatible /v1 endpoint)
#   base-url      endpoint root for OPENAI providers (Ollama, LiteLLM, vLLM, …)
#   api-key       bearer key; leave blank if none. Providers that require a key
#                 are HIDDEN in the UI when it's blank.
#   requires-key  when true, hide the provider unless api-key is set
#   discover-models  query the provider for its model list at runtime (merged
#                    with any models[] listed below)
#   models[n]     statically listed model ids (optional if discover-models=true)
#   timeout-seconds  per-request timeout (local/proxy generation can be slow)
#
# The chat UI shows a provider dropdown + a dependent model dropdown, populated
# from GET /api/chat/providers (which only returns usable providers).

# Optional: which provider to preselect. Blank = first available.
rag.default-provider=

# [0] Ollama / any OpenAI-compatible server. No key needed for local Ollama.
rag.providers[0].id=ollama
rag.providers[0].label=Ollama
rag.providers[0].type=OPENAI
rag.providers[0].base-url=${OLLAMA_BASE_URL:http://localhost:11434}
rag.providers[0].requires-key=false
rag.providers[0].discover-models=true
rag.providers[0].timeout-seconds=120

# [1] LiteLLM proxy (OpenAI-compatible). Point base-url at your LiteLLM server;
# set the key via env. It will be hidden until a key is provided.
rag.providers[1].id=litellm
rag.providers[1].label=LiteLLM
rag.providers[1].type=OPENAI
rag.providers[1].base-url=${LITELLM_BASE_URL:http://localhost:4000}
rag.providers[1].api-key=${LITELLM_API_KEY:}
rag.providers[1].requires-key=true
rag.providers[1].discover-models=true
rag.providers[1].timeout-seconds=120

# [2] Anthropic (hosted Claude), via the native SDK. Hidden until a key is set
# (either here or the ANTHROPIC_API_KEY env var). Models are listed statically
# because Anthropic isn't queried for a model list here.
rag.providers[2].id=anthropic
rag.providers[2].label=Claude (Anthropic)
rag.providers[2].type=ANTHROPIC
rag.providers[2].api-key=${ANTHROPIC_API_KEY:}
rag.providers[2].requires-key=true
rag.providers[2].discover-models=false
rag.providers[2].models[0]=claude-sonnet-4-5
rag.providers[2].models[1]=claude-opus-4-1
rag.providers[2].models[2]=claude-3-5-haiku-latest
