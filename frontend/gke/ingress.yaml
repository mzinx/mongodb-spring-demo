apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
  annotations:
    # Provision a global external L7 load balancer.
    kubernetes.io/ingress.class: "gce"
    # Reserved global static IP (created via:
    #   gcloud compute addresses create ${STATIC_IP_NAME} --global)
    kubernetes.io/ingress.global-static-ip-name: "${STATIC_IP_NAME}"
    # Attach the pre-uploaded (classic) SSL certificate from Google Cloud by name.
    ingress.gcp.kubernetes.io/pre-shared-cert: "${SSL_CERT_NAME}"
    # Serve both HTTP and HTTPS (set to "false" to force HTTPS-only).
    kubernetes.io/ingress.allow-http: "true"
spec:
  defaultBackend:
    service:
      name: ${APP_NAME}
      port:
        number: 80
