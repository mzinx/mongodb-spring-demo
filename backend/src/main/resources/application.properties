spring.application.name=mongodb-spring-demo
server.port=8080

# MongoDB connection - change streams require a replica set (or MongoDB Atlas).
# Override with the MONGODB_URI environment variable, e.g.
#   MONGODB_URI="mongodb+srv://user:pass@cluster/mongodb-spring-demo"
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mongodb-spring-demo}

# --- Admin (Basic auth) ---
# Credentials guarding the "Admin" tab APIs (/api/streams, /api/pipelines,
# /api/aggregations). Supply via the ADMIN_USERNAME / ADMIN_PASSWORD
# environment variables; the defaults below are for local development only.
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin}

# --- mongodb-spring-change-stream ---
# Faster config reconciliation so UI actions (start/stop/create) are picked up quickly.
change-stream.config-refresh-initial-delay=3000
change-stream.config-refresh-interval=10000

# --- mongodb-spring-message-queuing ---
# Collections watched by the built-in "live-data" change stream; changes are
# broadcast to WebSocket subscribers of /sync.
# orderSummaries -> live refresh of the Dashboard page (precomputed summaries)
messaging.watch-collections=orderSummaries
# STOMP heartbeats (defaults shown) let the server detect dead WebSocket
# connections — including intermittent network drops — so presence drops off
# promptly. Set either to 0 to disable that direction.
#messaging.heartbeat.server-ms=10000
#messaging.heartbeat.client-ms=10000

# --- mongodb-spring-discovery ---
discovery.heartbeat.interval=5000

# --- Spring Session (MongoDB) ---
# HTTP sessions are persisted in the `sessions` collection and expire after 30
# minutes of inactivity; both are configured on @EnableMongoHttpSession in
# SessionConfig. Each browser therefore has a stable, cluster-shared identity
# that drives the messaging presence list.

logging.level.com.mzinx=INFO
